name: Author CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  author-native:
    name: author backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install libmicrohttpd
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update && sudo apt-get install -y libmicrohttpd-dev
      - name: Configure
        run: >
          cmake -S . -B build -DMPC_BUILD_TESTS=ON -DMPC_BUILD_MPCGAIN=OFF
          -DMPC_BUILD_MPCCHAP=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j
      - name: Test Author backend
        run: >
          python3 scripts/ci_ctest.py --build build --config Release
          author_backend author_encode author_app_audit

  author-app:
    name: author app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: author
        run: npm ci
      - name: Type-check
        working-directory: author
        run: npm run check
      - name: Unit and component tests
        working-directory: author
        run: npm test
      - name: Build web bundle
        working-directory: author
        run: npm run build:web
