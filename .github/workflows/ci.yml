name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  router-test:
    name: Router regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test CI router
        run: python3 scripts/ci_router_test.py

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      codec: ${{ steps.detect.outputs.codec }}
      core: ${{ steps.detect.outputs.core }}
      server: ${{ steps.detect.outputs.server }}
      author: ${{ steps.detect.outputs.author }}
      wasm: ${{ steps.detect.outputs.wasm }}
      web: ${{ steps.detect.outputs.web }}
      research: ${{ steps.detect.outputs.research }}
      unknown: ${{ steps.detect.outputs.unknown }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            printf 'codec=true\ncore=true\nserver=true\nauthor=true\nwasm=true\nweb=true\nresearch=true\nunknown=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA" > /tmp/changed-files
          else
            git diff --name-only "$BEFORE" "$HEAD_SHA" > /tmp/changed-files
          fi

          cat /tmp/changed-files
          python3 scripts/ci_router.py < /tmp/changed-files | tee /tmp/router-output
          grep -E '^(codec|core|server|author|wasm|web|research|unknown)=' /tmp/router-output >> "$GITHUB_OUTPUT"

  codec:
    needs: changes
    if: needs.changes.outputs.codec == 'true'
    uses: ./.github/workflows/codec.yml
  musicpack-core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    uses: ./.github/workflows/musicpack-core.yml
  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    uses: ./.github/workflows/server.yml
  author:
    needs: changes
    if: needs.changes.outputs.author == 'true'
    uses: ./.github/workflows/author.yml
  wasm:
    needs: changes
    if: needs.changes.outputs.wasm == 'true'
    uses: ./.github/workflows/wasm.yml
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/web.yml
  research:
    needs: changes
    if: needs.changes.outputs.research == 'true'
    uses: ./.github/workflows/research.yml
