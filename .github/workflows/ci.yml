name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # needed to build the reference encoder at 05d97a5

      - name: Install libmicrohttpd
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y libmicrohttpd-dev
          else
            brew install libmicrohttpd
          fi

      - name: Configure
        run: >
          cmake -S . -B build
          -DMPC_BUILD_TESTS=ON
          -DMPC_BUILD_MPCGAIN=OFF
          -DMPC_BUILD_MPCCHAP=OFF

      - name: Build
        run: cmake --build build --config Release -j

      # C unit tests run everywhere; the shell-based integration/fuzz/fixture
      # suites (bash + python3) are UNIX-only. server_unit builds on Windows
      # too (the server core is platform-independent; the HTTP server itself
      # is not built there since libmicrohttpd is unavailable).
      - name: Test (unit + mpack + server)
        run: ctest --test-dir build -C Release -R "^(unit|mpack|server_unit)$" --output-on-failure

      - name: Test (integration + fuzz + fixtures)
        if: matrix.os != 'windows-latest'
        run: ctest --test-dir build -C Release -E "^unit$|^mpack$|^compat$" --output-on-failure

      # Build the pristine reference encoder (05d97a5) and verify the built
      # encoder is byte-identical to it. Runs on all platforms: the live
      # comparison is toolchain-agnostic (the committed -O0 manifest is only a
      # local fallback). Unix: patch the reference's hardcoded -O3 CFLAGS to
      # match the main build's default (-O0). Windows: both use --config
      # Release (/O2).
      - name: Checkout reference encoder
        shell: bash
        run: git worktree add --detach "$RUNNER_TEMP/musepack-ref" 05d97a5

      - name: Configure reference encoder
        shell: bash
        run: |
          # Keep only the encoder targets (libmpcpsy/libmpcenc/mpcenc): the
          # pristine tree cannot configure otherwise (mpcgain/mpcchap need
          # external libs; mpcdec/mpc2sv8/mpccut declare duplicate targets
          # under MSVC). Also aligns -O3 to -O0 and downgrades
          # -Wincompatible-pointer-types (an error on GCC 14+).
          PY="$(command -v python3 || command -v python)"
          "$PY" "$GITHUB_WORKSPACE/tests/patch_reference.py" "$RUNNER_TEMP/musepack-ref"
          cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -S "$RUNNER_TEMP/musepack-ref" -B "$RUNNER_TEMP/ref-build"

      - name: Build reference encoder
        shell: bash
        run: cmake --build "$RUNNER_TEMP/ref-build" --config Release -j --target mpcenc

      - name: Test (compat)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # MSVC multi-config builds put binaries in a per-config dir whose
            # exact layout varies by generator; locate it rather than guess.
            REF_MPCENC="$(find "$RUNNER_TEMP/ref-build" -name mpcenc.exe -type f | head -1)"
          else
            REF_MPCENC="$RUNNER_TEMP/ref-build/mpcenc/mpcenc"
          fi
          [ -x "$REF_MPCENC" ] || { echo "reference mpcenc not found"; exit 1; }
          export REF_MPCENC
          ctest --test-dir build -C Release -R "^compat$" --output-on-failure
          # Phase 2: extended-corpus q5/q6/q7 bit-exact regression (live mode,
          # same reference encoder => toolchain-agnostic per-platform proof).
          ctest --test-dir build -C Release -R "^enc_compat$" --output-on-failure

  wasm-build:
    name: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /opt/emsdk
          /opt/emsdk/emsdk install latest
          /opt/emsdk/emsdk activate latest

      - name: Configure
        shell: bash
        run: |
          source /opt/emsdk/emsdk_env.sh
          emcmake cmake -S . -B build-wasm -DMPC_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: |
          source /opt/emsdk/emsdk_env.sh
          cmake --build build-wasm -j

      - name: Test (wasm smoke)
        shell: bash
        run: |
          source /opt/emsdk/emsdk_env.sh
          ctest --test-dir build-wasm -R "^wasm_smoke$" --output-on-failure

  research:
    name: research (model-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Deterministic, model-free research tests only: pooling, L2/cosine,
      # cache identity, silence, album aggregation, storage encodings,
      # profile compatibility, metrics, cross-codec report pipeline.
      # OpenL3 / Essentia / Discogs-EffNet tests are skipped here (they need
      # TensorFlow or the AGPL/CC-NC-SA comparator stack and run locally).
      - name: Install test deps
        run: python -m pip install --upgrade pip pytest numpy soundfile

      - name: Run research tests (model-free)
        working-directory: research/sonic
        run: python -m pytest tests -q

  web-client:
    name: web-client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install libmicrohttpd
        run: sudo apt-get update && sudo apt-get install -y libmicrohttpd-dev

      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /opt/emsdk
          /opt/emsdk/emsdk install latest
          /opt/emsdk/emsdk activate latest

      - name: Build server
        run: |
          cmake -S . -B build -DMPC_BUILD_TESTS=OFF
          cmake --build build -j --target musicpack_server_cmd

      - name: Build wasm module
        shell: bash
        run: |
          source /opt/emsdk/emsdk_env.sh
          emcmake cmake -S . -B build-wasm
          cmake --build build-wasm -j --target musepack_wasm

      - name: Install + build client
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Type-check
        working-directory: web
        run: npx svelte-check --tsconfig ./tsconfig.json

      - name: Unit tests (Vitest)
        working-directory: web
        run: npx vitest run

      - name: Node wasm gapless harness
        working-directory: web
        run: node tests/node/wasm-gapless.mjs ../build-wasm/wasm/musepack.js ../tests/fixtures/sine44-q5.mpc ../tests/fixtures/sine44-q7.mpc ../tests/fixtures/sine44-q5-48s.mpc

      - name: Browser tests (Playwright)
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
