name: benchmark

# Repeatable decoder benchmarks for the SIMD milestone. Runs on x86-64
# (ubuntu-latest) natively and for the three WebAssembly configurations
# (scalar, auto-vectorized, explicit SIMD). ARM64 numbers are produced on
# Apple Silicon via bench/run_bench.sh (see bench/README.md).
#
# Results are uploaded as a workflow artifact (bench/results/*.tsv).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'libmpcdec/**'
      - 'libmpcenc/**'
      - 'libmpcpsy/**'
      - 'common/**'
      - 'tests/**'
      - 'mpcenc/**'
      - 'bench/**'
      - 'wasm/**'
      - 'CMakeLists.txt'
      - '.github/workflows/bench.yml'

jobs:
  native-x64:
    name: native (x86-64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure (Release, SIMD)
        run: >
          cmake -S . -B build
          -DMPC_BUILD_TESTS=ON
          -DMPC_BUILD_MPCGAIN=OFF
          -DMPC_BUILD_MPCCHAP=OFF
          -DCMAKE_BUILD_TYPE=Release

      - name: Configure psycho profile build
        run: >
          cmake -S . -B build-profile
          -DMPC_BUILD_TESTS=OFF
          -DMPC_BUILD_MPCGAIN=OFF
          -DMPC_BUILD_MPCCHAP=OFF
          -DMPC_ENABLE_PSY_PROFILE=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j --target mpc_bench mpc_psy_fft_bench mpcenc

      - name: Build psycho profile encoder
        run: cmake --build build-profile -j --target mpcenc

      - name: Generate corpus
        run: bench/make_corpus.sh /tmp/mpc-bench "$(pwd)/build/mpcenc/mpcenc"

      - name: Run benchmark (scalar + simd)
        run: |
          MPC_BENCH="$(pwd)/build/bench/decode_bench" MPC_BENCH_BUILD="$(pwd)/build" bench/run_bench.sh /tmp/mpc-bench --runs=5

      - name: Encoder corpus + benchmark (q5/q6/q7, scalar vs SIMD psycho)
        run: |
          python3 tests/generate_encoder_corpus.py /tmp/enc-corpus >/dev/null
          bench/encode_bench.sh /tmp/enc-corpus "$(pwd)/build/mpcenc/mpcenc" 5,6,7 5

      - name: Psychoacoustic FFT kernel benchmark
        run: |
          MPC_PSY_FFT_BENCH="$(pwd)/build/bench/psy_fft_bench" bench/run_psy_fft_bench.sh 1000

      - name: Psychoacoustic CPU-share profile (q5/q6/q7)
        run: |
          python3 bench/profile_psy.py \
            --mpcenc "$(pwd)/build-profile/mpcenc/mpcenc" \
            --input /tmp/enc-corpus/long_60s_44100.wav \
            --impl scalar --qualities 5,6,7 --warmup 1 --runs 5 \
            --output bench/results/psy-profile-x86_64-scalar.json
          python3 bench/profile_psy.py \
            --mpcenc "$(pwd)/build-profile/mpcenc/mpcenc" \
            --input /tmp/enc-corpus/long_60s_44100.wav \
            --impl simd --qualities 5,6,7 --warmup 1 --runs 5 \
            --output bench/results/psy-profile-x86_64-simd.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: bench-native-x64
          path: bench/results/

  wasm:
    name: wasm (scalar / auto-vec / SIMD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /opt/emsdk
          /opt/emsdk/emsdk install latest
          /opt/emsdk/emsdk activate latest

      - name: Build scalar wasm
        shell: bash
        run: |
          source /opt/emsdk/emsdk_env.sh
          emcmake cmake -S . -B build-wasm-scalar -DCMAKE_BUILD_TYPE=Release \
            -DMPC_WASM_SIMD=OFF -DMPC_ENABLE_SIMD=OFF
          cmake --build build-wasm-scalar -j --target musepack_wasm

      - name: Build auto-vectorized wasm (-msimd128, scalar C)
        shell: bash
        run: |
          source /opt/emsdk/emsdk_env.sh
          emcmake cmake -S . -B build-wasm-autovec -DCMAKE_BUILD_TYPE=Release \
            -DMPC_WASM_SIMD=ON -DMPC_ENABLE_SIMD=OFF
          cmake --build build-wasm-autovec -j --target musepack_wasm

      - name: Build explicit-SIMD wasm
        shell: bash
        run: |
          source /opt/emsdk/emsdk_env.sh
          emcmake cmake -S . -B build-wasm-simd -DCMAKE_BUILD_TYPE=Release \
            -DMPC_WASM_SIMD=ON -DMPC_ENABLE_SIMD=ON
          cmake --build build-wasm-simd -j --target musepack_wasm

      - name: Generate corpus
        run: |
          cmake -S . -B build-native -DMPC_BUILD_TESTS=OFF -DMPC_BUILD_MPCGAIN=OFF \
            -DMPC_BUILD_MPCCHAP=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build-native -j --target mpcenc
          bench/make_corpus.sh /tmp/mpc-bench "$(pwd)/build-native/mpcenc/mpcenc"

      - name: Run wasm benchmarks
        shell: bash
        run: |
          set -euo pipefail
          source /opt/emsdk/emsdk_env.sh
          C=/tmp/mpc-bench/corpus
          FILES=(
            "$C/uncorrelated_noise_44100-q7.mpc"
            "$C/stereo_sine_44100-q5.mpc"
            "$C/silence_44100-q5.mpc"
            "$C/clipping_edge_44100-q7.mpc"
            "$C/chirp_44100-q7.mpc"
            "tests/fixtures/sine44-q5-48s.mpc"
          )
          mkdir -p bench/results
          : > bench/results/wasm.tsv
          {
            echo "# commit: $GITHUB_SHA"
            echo "# cmake: $(cmake --version | head -1)"
            echo "# emscripten: $(emcc --version | head -1)"
            echo "# node: $(node --version)"
            echo "# columns: file rate channels block run audio_s frames wall_ms realtime_x config"
            for CFG in scalar autovec simd; do
              echo "# cmake $CFG"
              grep -E '^(CMAKE_BUILD_TYPE|CMAKE_C_COMPILER|CMAKE_C_FLAGS|CMAKE_C_FLAGS_RELEASE|MPC_ENABLE_SIMD|MPC_ENABLE_NATIVE_TUNING|MPC_WASM_SIMD):' \
                "build-wasm-$CFG/CMakeCache.txt" | sed 's/^/# /'
            done
          } >> bench/results/wasm.tsv
          ORDERS=("scalar autovec simd" "simd scalar autovec" "autovec simd scalar")
          for RUN in 1 2 3 4 5; do
            ORDER="${ORDERS[$(((RUN - 1) % 3))]}"
            echo "# run $RUN order: $ORDER" >> bench/results/wasm.tsv
            read -ra CONFIGS <<< "$ORDER"
            for CFG in "${CONFIGS[@]}"; do
              for F in "${FILES[@]}"; do
                node bench/wasm_bench.mjs "$(pwd)/build-wasm-$CFG/wasm/musepack.js" "$F" \
                  --blocks=1152 --runs=1 "--run-offset=$((RUN - 1))" "--config=$CFG" >> bench/results/wasm.tsv
              done
            done
          done
          python3 bench/summarize_bench.py --mode wasm --expected-runs 5 \
            bench/results/wasm.tsv bench/results/wasm-summary.tsv
          cat bench/results/wasm.tsv
          cat bench/results/wasm-summary.tsv

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: bench-wasm
          path: bench/results/
