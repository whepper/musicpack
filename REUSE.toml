version = 1
SPDX-PackageName = "MusicPack"
SPDX-PackageSupplier = "The MusicPack Development Team"
SPDX-PackageDownloadLocation = "https://github.com/whepper/musicpack"

# Default: MusicPack-owned non-code files are BSD-3-Clause. The patterns
# below deliberately avoid source files (.c/.h), which carry their own SPDX
# tags or are covered by the specific annotations further down. More specific
# annotations (matched last) override this default.

[[annotations]]
path = [
    "**/*.md",
    "**/CMakeLists.txt",
    "**/Cargo.toml",
    "**/*.cmake.in",
    "**/*.pc.in",
    "**/*.json",
    "**/*.yml",
    "**/*.yaml",
    "**/*.lock",
    "docs/**",
    "research/sonic/**",
    "specs/**",
    "packaging/**",
    ".github/**",
    ".opencode/**",
    ".gitignore",
    ".gitattributes",
    "author/.gitignore",
    "web/.gitignore",
    "web/tests/**",
    "author/tests/**",
    "author/src-tauri/icons/**",
    "author/src-tauri/build.rs",
    "author/src-tauri/capabilities/**",
    "web/playwright.config.ts",
    "web/vite.config.ts",
    "web/svelte.config.js",
    "author/vite.config.ts",
    "author/svelte.config.js",
    "web/app/public/**",
    "demo/index.html",
    "bench/profile_psy.py",
    "bench/summarize_bench.py",
    "bench/wasm_bench.mjs",
    "server/vendor/sqlite/README",
    "libmpcdec/cmake/**",
    "libmusicpack/cmake/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "The MusicPack Development Team"
SPDX-License-Identifier = "BSD-3-Clause"

